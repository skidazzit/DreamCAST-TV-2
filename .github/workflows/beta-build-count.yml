name: Increment DreamCAST beta build number

on:
  push:
    branches:
      - feature/dreamcast-ios
      - feature/dreamcast-tvOS

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  increment:
    if: "!contains(github.event.head_commit.message, '[build-count-init]') && !contains(github.event.head_commit.message, '[skip build count]') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 1
      - name: Increment build number with push-conflict retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$GITHUB_REF_NAME"

          # Other pushes can arrive while this job is running. Always
          # start from the latest remote branch and retry rejected pushes.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard FETCH_HEAD

            python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          branch = os.environ["GITHUB_REF_NAME"]
          project = Path(
              "DreamCAST-iOS.xcodeproj/project.pbxproj"
              if branch == "feature/dreamcast-ios"
              else "DreamCAST-tvOS.xcodeproj/project.pbxproj"
          )
          source = project.read_text()
          matches = re.findall(r"CURRENT_PROJECT_VERSION = (\d+);", source)
          if not matches or len(set(matches)) != 1:
              raise SystemExit(f"Missing or inconsistent build numbers: {set(matches)}")
          old = int(matches[0])
          new = old + 1
          project.write_text(source.replace(
              f"CURRENT_PROJECT_VERSION = {old};",
              f"CURRENT_PROJECT_VERSION = {new};"
          ))
          print(f"{branch}: beta build {old} -> {new}")
          PY

            git add DreamCAST-*.xcodeproj/project.pbxproj
            git commit -m "chore(beta): increment build number [skip ci]"
            if git push origin "HEAD:$branch"; then
              echo "Build count updated successfully."
              exit 0
            fi
            echo "Remote changed during push (attempt $attempt); retrying."
            sleep 2
          done
          echo "::error::Build count could not be pushed after 8 attempts."
          exit 1
