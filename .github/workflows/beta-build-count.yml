name: Increment DreamCAST beta build number

on:
  push:
    branches:
      - feature/dreamcast-ios
      - feature/dreamcast-tvOS

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  increment:
    if: "!contains(github.event.head_commit.message, '[build-count-init]') && !contains(github.event.head_commit.message, '[skip build count]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Increment Xcode build version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          branch = os.environ["GITHUB_REF_NAME"]
          project = Path("DreamCAST-iOS.xcodeproj/project.pbxproj" if branch == "feature/dreamcast-ios" else "DreamCAST-tvOS.xcodeproj/project.pbxproj")
          source = project.read_text()
          matches = re.findall(r"CURRENT_PROJECT_VERSION = (\d+);", source)
          if not matches:
              raise SystemExit("No CURRENT_PROJECT_VERSION entries found")
          versions = set(matches)
          if len(versions) != 1:
              raise SystemExit(f"Inconsistent target build versions: {versions}")
          old = int(matches[0])
          new = old + 1
          project.write_text(source.replace(f"CURRENT_PROJECT_VERSION = {old};", f"CURRENT_PROJECT_VERSION = {new};"))
          print(f"{branch}: beta build {old} -> {new}")
          PY
      - name: Commit new build number
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DreamCAST-*.xcodeproj/project.pbxproj
          git commit -m "chore(beta): increment build number [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
